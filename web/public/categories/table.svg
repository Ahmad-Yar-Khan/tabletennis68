  <path d="M44 210 L356 210 L314 136 L86 136 Z" fill="none" stroke="#ffffff" stroke-width="3"/>
  <path d="M200 210 L200 136" stroke="#ffffff" stroke-width="2"/>
  <!-- net -->
  <path d="M52 173 L348 173 L348 145 L52 145 Z" fill="url(#mesh)"/>
  <path d="M52 145 L348 145" stroke="#ffffff" stroke-width="5"/>
  <rect x="44" y="140" width="9" height="40" rx="2" fill="#0e0b0c"/>
  <rect x="347" y="140" width="9" height="40" rx="2" fill="#0e0b0c"/>
  <!-- front legs -->
  <rect x="58" y="228" width="16" height="78" fill="#0e0b0c"/>
  <rect x="326" y="228" width="16" height="78" fill="#0e0b0c"/>
  <rect x="52" y="300" width="28" height="8" rx="4" fill="#e11d2e"/>
  <rect x="320" y="300" width="28" height="8" rx="4" fill="#e11d2e"/>
  <!-- ball -->
  <circle cx="262" cy="106" r="12" fill="#ffffff" stroke="#e2d9d6" stroke-width="1.5"/>
  <path d="M214 196 Q240 90 262 106" fill="none" stroke="#ff5a5f" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"/>
