<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="body" cx="40%" cy="30%" r="85%">
      <stop offset="0" stop-color="#3a3133"/>
      <stop offset="0.7" stop-color="#1d1718"/>
      <stop offset="1" stop-color="#0e0b0c"/>
    </radialGradient>
  </defs>
  <ellipse cx="200" cy="350" rx="140" ry="14" fill="#0e0b0c" opacity="0.08"/>
  <g transform="rotate(-24 200 200)">
    <!-- carry loop -->
    <path d="M150 52 Q200 -6 250 52" fill="none" stroke="#9f1222" stroke-width="12" stroke-linecap="round"/>
    <!-- case body (paddle-shaped) -->
    <rect x="168" y="250" width="64" height="126" rx="24" fill="#1d1718"/>
    <ellipse cx="200" cy="160" rx="118" ry="126" fill="url(#body)"/>
    <!-- red piping + zip -->
    <ellipse cx="200" cy="160" rx="108" ry="116" fill="none" stroke="#e11d2e" stroke-width="4"/>
    <ellipse cx="200" cy="160" rx="101" ry="109" fill="none" stroke="#8c8183" stroke-width="5" stroke-dasharray="3 3"/>
    <!-- zip pull -->
    <rect x="292" y="148" width="14" height="34" rx="5" fill="#d6ccc9" transform="rotate(10 299 165)"/>
    <!-- front pocket / badge -->
    <rect x="148" y="132" width="104" height="56" rx="16" fill="#e11d2e"/>
    <rect x="164" y="154" width="72" height="8" rx="4" fill="#ffffff"/>
    <rect x="178" y="168" width="44" height="5" rx="2.5" fill="#ffffff" opacity="0.7"/>
    <ellipse cx="160" cy="88" rx="46" ry="22" fill="#ffffff" opacity="0.08" transform="rotate(-25 160 88)"/>
  </g>
</svg>
