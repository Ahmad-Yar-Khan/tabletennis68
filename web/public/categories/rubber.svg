<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <pattern id="pips" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2.4" fill="#2a2426"/>
    </pattern>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2404f"/>
      <stop offset="1" stop-color="#b3121f"/>
    </linearGradient>
  </defs>
  <ellipse cx="200" cy="340" rx="150" ry="15" fill="#0e0b0c" opacity="0.08"/>
  <!-- black sheet (back), pimples-in side showing -->
  <g transform="rotate(-14 160 190)">
    <rect x="66" y="78" width="180" height="210" rx="34" fill="#f0c95e"/>
    <rect x="66" y="70" width="180" height="210" rx="34" fill="#151112"/>
    <rect x="80" y="84" width="152" height="182" rx="26" fill="url(#pips)"/>
  </g>
  <!-- red sheet (front), with yellow sponge edge -->
  <g transform="rotate(9 240 210)">
    <rect x="150" y="112" width="180" height="210" rx="34" fill="#e8b84a"/>
    <rect x="150" y="104" width="180" height="210" rx="34" fill="url(#red)"/>
    <path d="M176 128 Q240 116 302 132" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.18"/>
    <rect x="196" y="270" width="88" height="22" rx="11" fill="#0e0b0c" opacity="0.85"/>
    <rect x="210" y="279" width="60" height="4" rx="2" fill="#ff5a5f"/>
  </g>
</svg>
